# Cinematic fly-around for presentation videos (farm_sim/cinematic.py).
# Keyframes in the tractor frame: x right, y forward, z up [m]; t in s after `start`.
# Use with --autodrive (the tractor starts at t = 2 s) and --record-view cinematic:
#   python scripts/run_sim.py --headless --no-sensors --no-ros \
#       --scenario config/scenarios/wheat_demo.yaml --field config/fields/wheat_ripe_de.yaml \
#       --autodrive 7 --cinematic config/cinematic/flyaround.yaml \
#       --record out/cine --record-view cinematic --record-fps 25 --render-hz 25 \
#       --record-start 4 --duration 25
start: 4.0
filter_s: 0.8
keyframes:
  # low in the wheat ahead-left, long lens: the tractor comes towards us
  - {t: 0,  pos: [-3.5, 32.0, 1.3],  look: [0.0, 0.0, 1.9],  focal_mm: 50}
  - {t: 4,  pos: [-5.5, 15.0, 1.6],  look: [0.0, 0.0, 1.8],  focal_mm: 40}
  # sweep along its left side, rising a bit
  - {t: 8,  pos: [-9.0, 2.0, 2.6],   look: [0.0, 0.5, 1.7],  focal_mm: 30}
  - {t: 11, pos: [-7.5, -9.0, 4.5],  look: [0.0, 2.0, 1.6],  focal_mm: 28}
  # behind it, craning up and revealing the field (tractor stays in the lower third,
  # horizon in frame)
  - {t: 14, pos: [-3.0, -16.0, 8.0], look: [0.0, 6.0, 1.2],  focal_mm: 26}
  - {t: 17, pos: [-1.0, -24.0, 12.0], look: [0.0, 14.0, 2.0], focal_mm: 24}
  - {t: 20, pos: [0.0, -30.0, 16.0], look: [0.0, 30.0, 3.0],  focal_mm: 24}
