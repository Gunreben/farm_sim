# The fly-around reversed and compressed to 15 s: from drone height behind the tractor down
# along its side to low in the wheat ahead (tractor coming towards the camera). Rendered three
# times (young wheat, ripe wheat, lidar) and cut together at 5 s / 10 s for the presentation.
start: 4.0
filter_s: 0.8
keyframes:
  - {t: 0,    pos: [0.0, -30.0, 16.0], look: [0.0, 30.0, 3.0],  focal_mm: 24}
  - {t: 2.5,  pos: [-1.0, -24.0, 12.0], look: [0.0, 14.0, 2.0], focal_mm: 24}
  - {t: 5,    pos: [-3.0, -16.0, 8.0], look: [0.0, 6.0, 1.2],  focal_mm: 26}
  - {t: 7.5,  pos: [-7.5, -8.0, 4.5],  look: [0.0, 2.0, 1.6],  focal_mm: 28}
  - {t: 10,   pos: [-9.0, 2.0, 2.6],   look: [0.0, 0.5, 1.7],  focal_mm: 30}
  - {t: 12.5, pos: [-6.0, 12.0, 1.7],  look: [0.0, 0.0, 1.8],  focal_mm: 38}
  - {t: 15,   pos: [-4.0, 22.0, 1.4],  look: [0.0, 0.0, 1.9],  focal_mm: 45}
